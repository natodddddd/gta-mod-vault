<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA SA Mod Vault</title>
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navbar Header -->
  <header class="navbar">
    <div class="container nav-container">
      <select id="themeSelect" onchange="changeTheme(this.value)">
        <option value="default">Dark Vault (Gold)</option>
        <option value="grove">Grove Street (Hijau)</option>
        <option value="light">Putih (Light)</option>
        <option value="black">Hitam (Pitch Black)</option>
        <option value="blue">Biru (Ocean)</option>
        <option value="pink">Pink (Vice City)</option>
      </select>

      <div class="logo">SAN ANDREAS <span>VAULT</span></div>
      <input type="text" id="searchInput" placeholder="Cari mod, mobil, script..." autocomplete="off">
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <!-- Filter Kategori -->
    <div class="category-bar" id="categoryBar">
      <button class="cat-btn active" data-cat="All">All Mods</button>
      <button class="cat-btn" data-cat="Vehicles">Vehicles</button>
      <button class="cat-btn" data-cat="Graphics">Graphics</button>
      <button class="cat-btn" data-cat="CLEO">CLEO</button>
      <button class="cat-btn" data-cat="Skins">Skins</button>
    </div>

    <!-- Grid Tempat Mod Ditampilkan -->
    <div id="modGrid" class="mod-grid"></div>
  </main>

  <!-- Modal Preview -->
  <div id="modModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <img id="modalImg" class="modal-img" src="" alt="Mod Preview">
      <h3 id="modalTitle" class="modal-title"></h3>
      <div id="modalMeta" class="modal-meta"></div>
      
      <div class="modal-section">
        <h4>Deskripsi</h4>
        <p id="modalDesc"></p>
      </div>

      <div class="modal-section">
        <h4>Panduan Pasang</h4>
        <p id="modalGuide" style="white-space: pre-line;"></p>
      </div>

      <a id="modalDownload" href="#" target="_blank" class="download-btn">DOWNLOAD MOD</a>

      <!-- Area Komentar (SUDAH DIPINDAHKAN KE DALAM MODAL CONTENT) -->
      <div class="modal-section comment-section" style="margin-top: 25px; border-top: 1px solid #333; padding-top: 15px;">
        <h4>Komentar Pengunjung</h4>
        
        <!-- Wadah List Komentar -->
        <div id="commentsList" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px;"></div>

        <!-- Form Kirim Komentar -->
        <form onsubmit="submitComment(event)" style="display: flex; flex-direction: column; gap: 8px;">
          <input type="text" id="commentAuthor" placeholder="Nama kamu" required style="padding: 8px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff;">
          <textarea id="commentText" placeholder="Tulis komentar..." required rows="2" style="padding: 8px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; resize: vertical;"></textarea>
          <button type="submit" class="download-btn" style="padding: 8px; cursor: pointer;">KIRIM KOMENTAR</button>
        </form>
      </div>

    </div>
  </div>

  <!-- SDK Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script src="app.js"></script>
  
</body>
</html>
