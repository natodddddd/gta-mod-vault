<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - GTA SA Mod Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0f0f11;
      --bg-surface: #18181b;
      --border: #27272a;
      --accent: #f5b800;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-dark); color: var(--text-main); font-family: 'Space Grotesk', sans-serif; padding: 20px; }
    .container { max-width: 600px; margin: 40px auto; background: var(--bg-surface); border: 1px solid var(--border); padding: 24px; }
    h2 { color: var(--accent); margin-bottom: 20px; font-size: 1.3rem; }
    
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
    input, select, textarea {
      width: 100%; padding: 10px; background: var(--bg-dark); border: 1px solid var(--border);
      color: var(--text-main); font-family: inherit; font-size: 0.9rem;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
    
    .btn {
      width: 100%; padding: 12px; background: var(--accent); color: #000; font-weight: 700;
      border: none; cursor: pointer; text-transform: uppercase; font-family: inherit; margin-top: 10px;
    }
    .btn-danger { background: var(--danger); color: #fff; width: auto; padding: 4px 8px; font-size: 0.75rem; border: none; cursor: pointer; }

    .hidden { display: none !important; }
    .mod-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); }
  </style>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="container">
    <!-- Form Login Admin -->
    <div id="login-section">
      <h2>Login Admin Mod Vault</h2>
      <form id="login-form">
        <div class="form-group">
          <label>Email Admin</label>
          <input type="email" id="login-email" required placeholder="bayu@sa-mp.my.id">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" required>
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
    </div>

    <!-- Panel Upload Mod -->
    <div id="admin-dashboard" class="hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>Tambah Mod Baru</h2>
        <button id="btn-logout" style="background:none; border:none; color:var(--text-muted); cursor:pointer; text-decoration:underline;">Logout</button>
      </div>

      <form id="upload-form">
        <div class="form-group">
          <label>Nama / Judul Mod</label>
          <input type="text" id="mod-title" required placeholder="Contoh: Honda Vario 150 Drag">
        </div>
        <div class="form-group">
          <label>Kategori</label>
          <select id="mod-category" required>
            <option value="Vehicles">Vehicles</option>
            <option value="Weapons">Weapons</option>
            <option value="Graphics">Graphics</option>
            <option value="Skins">Skins</option>
            <option value="Map">Map</option>
          </select>
        </div>
        <div class="form-group">
          <label>Author / Pembuat</label>
          <input type="text" id="mod-author" placeholder="Contoh: Bayu Azhar">
        </div>
        <div class="form-group">
          <label>Ukuran File</label>
          <input type="text" id="mod-size" placeholder="Contoh: 15 MB">
        </div>
        <div class="form-group">
          <label>URL Gambar Thumbnail</label>
          <input type="url" id="mod-image" required placeholder="https://i.ibb.co/xxx/image.jpg">
        </div>
        <div class="form-group">
          <label>URL Download</label>
          <input type="url" id="mod-download" required placeholder="https://mediafire.com/file/xxx">
        </div>
        <div class="form-group">
          <label>Deskripsi Mod</label>
          <textarea id="mod-desc" rows="3" placeholder="Penjelasan singkat mod..."></textarea>
        </div>
        <div class="form-group">
          <label>Panduan Instalasi</label>
          <textarea id="mod-guide" rows="2" placeholder="1. Ekstrak file&#10;2. Masukkan ke folder modloader"></textarea>
        </div>
        <button type="submit" class="btn">Upload Mod Ke Web</button>
      </form>

      <h2 style="margin-top: 40px;">Daftar Mod Terpasang</h2>
      <div id="admin-mod-list"></div>
    </div>
  </div>

  <script>
    // Config Firebase Kunci Asli dari Proyek Kamu
    const firebaseConfig = {
      apiKey: "AIzaSyDi2mtSkBA8nzMFS9P_XW85pgLd1xuv2vQ",
      authDomain: "gtakuh-64e29.firebaseapp.com",
      databaseURL: "https://gtakuh-64e29-default-rtdb.firebaseio.com",
      projectId: "gtakuh-64e29",
      storageBucket: "gtakuh-64e29.firebasestorage.app",
      messagingSenderId: "49771543806",
      appId: "1:49771543806:web:c704c55460157b549139af"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const loginSection = document.getElementById('login-section');
    const adminDashboard = document.getElementById('admin-dashboard');

    auth.onAuthStateChanged((user) => {
      if (user) {
        loginSection.classList.add('hidden');
        adminDashboard.classList.remove('hidden');
        loadAdminMods();
      } else {
        loginSection.classList.remove('hidden');
        adminDashboard.classList.add('hidden');
      }
    });

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      
      auth.signInWithEmailAndPassword(email, pass)
        .catch(err => alert("Gagal login: " + err.message));
    });

    document.getElementById('btn-logout').addEventListener('click', () => auth.signOut());

    document.getElementById('upload-form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const newMod = {
        title: document.getElementById('mod-title').value,
        category: document.getElementById('mod-category').value,
        author: document.getElementById('mod-author').value || 'Unknown',
        file_size: document.getElementById('mod-size').value || 'N/A',
        thumbnail: document.getElementById('mod-image').value,
        download_url: document.getElementById('mod-download').value,
        description: document.getElementById('mod-desc').value || '',
        install_guide: document.getElementById('mod-guide').value || '',
        createdAt: Date.now()
      };

      db.ref('mods').push(newMod)
        .then(() => {
          alert("Mod Berhasil Diupload!");
          document.getElementById('upload-form').reset();
        })
        .catch(err => alert("Gagal upload: " + err.message));
    });

    function loadAdminMods() {
      db.ref('mods').on('value', (snapshot) => {
        const modContainer = document.getElementById('admin-mod-list');
        modContainer.innerHTML = '';
        
        if (!snapshot.exists()) {
          modContainer.innerHTML = '<p style="color:#888;">Belum ada mod di database.</p>';
          return;
        }

        snapshot.forEach((child) => {
          const key = child.key;
          const mod = child.val();
          
          const item = document.createElement('div');
          item.className = 'mod-item';
          item.innerHTML = `
            <span><strong>${mod.title}</strong> (${mod.category})</span>
            <button onclick="deleteMod('${key}')" class="btn-danger">Hapus</button>
          `;
          modContainer.appendChild(item);
        });
      });
    }

    function deleteMod(key) {
      if (confirm("Yakin mau hapus mod ini?")) {
        db.ref('mods/' + key).remove();
      }
    }
  </script>
</body>
</html>
